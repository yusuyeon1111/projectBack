name: CI

on:
  pull_request: # base를 가리지 않는다. 앞 PR 브랜치 위에 쌓은 PR에서도 돈다
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포: 테스트를 다시 돈 뒤 고른 서비스를 배포한다
    inputs:
      service:
        description: 다시 띄울 서비스
        type: choice
        options: [app, web, all]

jobs:
  backend:
    runs-on: ubuntu-latest
    # 테스트가 @SpringBootTest라 실제 MySQL·Redis가 필요하다
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: project
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/project?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ci
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_USESSL: 'false' # 운영(ElastiCache)은 SSL, CI의 Redis는 평문
      KAKAO_CLIENT_ID: ci-dummy
      AWS_REGION: ap-northeast-2
      AWS_S3_BUCKET_NAME: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Claude Code hook 테스트
        run: python3 .claude/hooks/test_hooks.py
      - name: JWT 테스트 키 생성
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Test
        run: ./gradlew test
      - name: 실패한 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true
      # CI=true라서 ESLint 경고도 빌드 실패로 본다
      - name: Build
        run: npm run build
        env:
          CI: true

  # 운영과 같은 Docker Compose(앱·MySQL·Redis·Caddy)를 https://localhost로 띄워 브라우저로 핵심 흐름을 누른다
  e2e:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-root
      DB_PASSWORD: ci
      KAKAO_CLIENT_ID: ci-dummy
      REACT_APP_KAKAO_API_KEY: ci-dummy
      ACME_EMAIL: ci@example.com
      AWS_S3_BUCKET_NAME: ci-dummy
      DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - name: JWT 테스트 키 생성
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: 운영 구성으로 기동
        working-directory: deploy
        run: docker compose -p e2e up -d --build
      - name: 기동 대기 후 smoke
        run: |
          for _ in $(seq 1 60); do SMOKE_INSECURE=1 deploy/smoke.sh https://localhost >/dev/null 2>&1 && break; sleep 5; done
          SMOKE_INSECURE=1 deploy/smoke.sh https://localhost
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=https://localhost npx playwright test
      - name: 실패 시 컨테이너 로그
        if: failure()
        working-directory: deploy
        run: docker compose -p e2e logs --tail 200 app web
      - name: 실패 시 Playwright 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

  # main에 들어온 커밋을 세 잡이 통과한 뒤 운영에 배포한다. smoke가 실패하면 deploy.sh가 이전 커밋으로 되돌리고 실패로 끝난다
  deploy:
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: { group: production, cancel-in-progress: false }
    permissions:
      id-token: write # GitHub OIDC 토큰으로 AWS 역할을 받는다(저장소에 AWS 키 없음)
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 다시 띄울 서비스 판단
        id: target
        run: |
          if [ -n "${{ inputs.service }}" ]; then svc="${{ inputs.service }}"; else svc=$(deploy/target.sh "${{ github.event.before }}" "$GITHUB_SHA"); fi
          echo "svc=$svc" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $svc"
      - if: steps.target.outputs.svc != 'none'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1. 배포 역할을 받는 서드파티 액션이라 태그가 아닌 커밋으로 고정
        with:
          role-to-assume: arn:aws:iam::830283279722:role/teamhaeyo-github-deploy
          aws-region: ap-northeast-2
      - name: 배포와 smoke
        if: steps.target.outputs.svc != 'none'
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: deploy/deploy.sh "${{ steps.target.outputs.svc }}"
