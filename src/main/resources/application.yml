spring:
  application:
    name: project
  jackson:
    # @JsonFormat에 timezone이 없으면 UTC로 직렬화되어 작성일이 9시간 이르게 표시됐다
    time-zone: Asia/Seoul
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-authentication-method: client_secret_post
            redirect-uri: 'https://teamhaeyo.kro.kr/login/oauth2/code/kakao'
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_nickname
              - account_email
          # 값이 없어도 기동은 되게 기본값을 둔다(그때는 네이버 로그인만 실패한다)
          naver:
            client-id: ${NAVER_CLIENT_ID:not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:not-configured}
            client-authentication-method: client_secret_post
            redirect-uri: 'https://teamhaeyo.kro.kr/login/oauth2/code/naver'
            authorization-grant-type: authorization_code
            client-name: naver
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            # 네이버는 사용자 정보를 response 안에 담아 준다. 꺼내 쓰는 건 CustomerOAuth2UserService
            user-name-attribute: response

  flyway:
    # Flyway 도입 전 ddl-auto로 테이블이 만들어진 로컬 개발 DB는 V1을 실행하지 않고 적용된 것으로 표시만 한다.
    # 빈 DB(CI, 첫 배포)에는 영향이 없다. 로컬 DB를 모두 새로 만들면 지워도 된다
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 테이블이 어긋나면 기동을 멈춘다
      ddl-auto: validate
      format_sql: true
      use_sql_comments: true
    show-sql: true
    open-in-view: false # 대신 WebMvcConfig에서 SSE 구독만 빼고 건다
    properties:
      hibernate:
        # 목록처럼 여러 글의 연관 컬렉션을 읽을 때 글마다 따로 조회하지 않고 IN으로 묶는다
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      usessl: true

# JWT KEY
jwt:
  secret: ${JWT_SECRET}

# AWS S3 설정 통합
aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}

logging:
  level:
    org.example.project: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.ValueBinder: trace
server:
  forward-headers-strategy: native