spring:
  application:
    name: project
  jackson:
    # @JsonFormat에 timezone이 없으면 UTC로 직렬화되어 작성일이 9시간 이르게 표시됐다
    time-zone: Asia/Seoul
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-authentication-method: client_secret_post
            redirect-uri: 'https://teamhaeyo.kro.kr/login/oauth2/code/kakao'
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
      format_sql: true
      use_sql_comments: true
    show-sql: true
    open-in-view: false # 대신 WebMvcConfig에서 SSE 구독만 빼고 건다
    properties:
      hibernate:
        # 목록처럼 여러 글의 연관 컬렉션을 읽을 때 글마다 따로 조회하지 않고 IN으로 묶는다
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      usessl: true

# JWT KEY
jwt:
  secret: ${JWT_SECRET}

# AWS S3 설정 통합
aws:
  s3:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}

logging:
  level:
    org.example.project: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.ValueBinder: trace
server:
  forward-headers-strategy: native